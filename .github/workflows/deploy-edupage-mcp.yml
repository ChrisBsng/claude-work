name: Deploy Edupage MCP Server

on:
  push:
    branches: [main]
    paths:
      - "edupage-mcp/**"
      - ".github/workflows/deploy-edupage-mcp.yml"
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    working-directory: edupage-mcp

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: edupage-mcp/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npx tsc --noEmit

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: edupage-mcp
          command: deploy
          secrets: |
            EDUPAGE_SUBDOMAIN
            EDUPAGE_USERNAME
            EDUPAGE_PASSWORD
            MCP_AUTH_TOKEN
        env:
          EDUPAGE_SUBDOMAIN: ${{ secrets.EDUPAGE_SUBDOMAIN }}
          EDUPAGE_USERNAME: ${{ secrets.EDUPAGE_USERNAME }}
          EDUPAGE_PASSWORD: ${{ secrets.EDUPAGE_PASSWORD }}
          MCP_AUTH_TOKEN: ${{ secrets.MCP_AUTH_TOKEN }}
