name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - "pausen-checkin/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    working-directory: pausen-checkin

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pausen-checkin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply pausen-checkin-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: pausen-checkin
          # CUSTOM_DOMAIN kommt aus einer GitHub-Actions-Repository-Variable
          # (Settings -> Secrets and variables -> Actions -> Variables).
          # Leer, wenn nicht gesetzt -> Worker fällt auf die anfragende
          # Domain zurück (siehe src/baseUrl.ts).
          command: deploy --var CUSTOM_DOMAIN:${{ vars.CUSTOM_DOMAIN }}
          secrets: |
            ADMIN_PASSWORD
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
